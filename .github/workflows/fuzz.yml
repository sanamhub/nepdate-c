# The four libFuzzer targets with ASan and UBSan: 60 seconds on a pull request and 10 minutes
# nightly. The corpus is restored and saved through the Actions cache, so a found path survives the
# run; a crashing input is uploaded as an artifact for the minimised regression test.
name: fuzz

on:
  pull_request:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: clang-18
  CXX: clang-18

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [parse_strict, parse_lenient, format_pattern, from_unix]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 ninja-build
      - name: Configure with the fuzz preset
        run: cmake --preset fuzz
      - name: Build the target
        run: cmake --build build/fuzz --target fuzz_${{ matrix.target }}
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/fuzz/corpus/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-
      - name: Fuzz for 60 seconds, or 10 minutes nightly
        env:
          SECONDS_TO_FUZZ: ${{ github.event_name == 'schedule' && 600 || 60 }}
        run: |
          mkdir -p "build/fuzz/fuzz/corpus/${{ matrix.target }}" "build/fuzz/artifacts/${{ matrix.target }}"
          "build/fuzz/fuzz/bin/fuzz_${{ matrix.target }}" \
            -max_total_time="$SECONDS_TO_FUZZ" \
            -print_final_stats=1 \
            -artifact_prefix="build/fuzz/artifacts/${{ matrix.target }}/" \
            "build/fuzz/fuzz/corpus/${{ matrix.target }}" \
            "build/fuzz/fuzz/seeds/${{ matrix.target }}"
      - name: Keep a crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: build/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/fuzz/corpus/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}

# Weekly: replaces shared/ with the hub's main, regenerates src/generated and dist and opens one PR
# on bot/shared-sync (ADR-0001, hub ADR-0001 decision 3).
#
# regenerate builds only tools/codegen (tests off), runs the codegen target, and rewrites the
# amalgamation in dist/, which embeds the generated tables; gate 15 checks both.
name: shared-sync

on:
  schedule:
    - cron: "25 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: sanamhub/nepdate/.github/workflows/shared-sync.yml@827791325bf9c16258e5619dce5ecbd8e55e63e1 # main 2026-10-30
    with:
      regenerate: >-
        cmake -S . -B build/codegen -DNEPDATE_C_BUILD_TOOLS=ON -DNEPDATE_C_BUILD_TESTS=OFF &&
        cmake --build build/codegen --target codegen &&
        cmake -P tools/amalgamate.cmake
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
